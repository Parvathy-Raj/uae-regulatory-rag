[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uae-regulatory-rag"
version = "0.1.0"
description = "Evaluation-first RAG over public UAE Federal Tax Authority guides."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pdfplumber>=0.11",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "torch==2.15.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "mlflow>=2.14",
    "streamlit>=1.42",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]
demo = ["playwright>=1.45", "pillow>=10"]  # scripts/record_demo.py

[project.scripts]
uae-rag = "uae_rag.cli:app"

# Linux (CI, Docker) gets CPU-only torch; Windows/macOS PyPI wheels are already CPU builds.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uae_rag = ["ui/assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# E501: `ruff format` owns line length; long CSS/prompt strings are left intact.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
